<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A modern breathable rain shell jacket with a hood and taped seams">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="55%" stop-color="#0d2033"/>
      <stop offset="100%" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="45%" stop-color="#16293f"/>
      <stop offset="100%" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="shellHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="rsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#rbg)"/>
  <ellipse cx="400" cy="280" rx="300" ry="230" fill="url(#rglow)"/>
  <ellipse cx="400" cy="540" rx="150" ry="16" fill="#000" opacity="0.5" filter="url(#rsoft)"/>

  <!-- beading water droplets -->
  <g fill="#7dd3fc" fill-opacity="0.5">
    <circle cx="150" cy="120" r="4"/><circle cx="196" cy="186" r="3"/>
    <circle cx="118" cy="246" r="3.5"/><circle cx="660" cy="140" r="4"/>
    <circle cx="618" cy="206" r="3"/><circle cx="688" cy="268" r="3.5"/>
  </g>

  <!-- hood -->
  <path d="M400 96 c-52 0 -86 30 -92 74 c-2 16 6 26 18 26 h148 c12 0 20 -10 18 -26 c-6 -44 -40 -74 -92 -74 Z" fill="url(#shell)"/>
  <path d="M400 96 c-52 0 -86 30 -92 74 c-2 16 6 26 18 26 h20 c-14 -52 14 -84 54 -100 Z" fill="url(#shellHi)"/>
  <path d="M336 176 q64 26 128 0" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- body -->
  <path d="M292 196 h216 l82 52 c10 6 12 18 6 28 l-30 50 c-6 10 -20 12 -28 4 l-22 -22 v182 c0 12 -8 20 -20 20 H304 c-12 0 -20 -8 -20 -20 V308 l-22 22 c-8 8 -22 6 -28 -4 l-30 -50 c-6 -10 -4 -22 6 -28 Z"
        fill="url(#shell)"/>
  <path d="M292 196 h60 l-22 314 h-26 c-12 0 -20 -8 -20 -20 V308 l-22 22 c-8 8 -22 6 -28 -4 l-30 -50 c-6 -10 -4 -22 6 -28 Z"
        fill="url(#shellHi)"/>

  <!-- centre storm-flap zip -->
  <rect x="394" y="196" width="12" height="314" rx="6" fill="#0b1a2b"/>
  <g stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <path d="M400 200 v306"/>
  </g>
  <circle cx="400" cy="352" r="9" fill="#38bdf8"/>
  <rect x="396" y="356" width="8" height="24" rx="4" fill="#38bdf8"/>

  <!-- taped seams -->
  <g stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2.2" stroke-dasharray="8 7" fill="none">
    <path d="M330 210 v300"/>
    <path d="M470 210 v300"/>
    <path d="M292 262 h216"/>
  </g>

  <!-- pit-zip vents -->
  <g stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
    <path d="M306 276 l-24 42"/>
    <path d="M494 276 l24 42"/>
  </g>

  <!-- hand pockets -->
  <g fill="none" stroke="#0b1a2b" stroke-width="5" stroke-linecap="round">
    <path d="M318 404 h50"/>
    <path d="M432 404 h50"/>
  </g>

  <!-- hem cinch -->
  <path d="M284 494 h232" stroke="#0b1a2b" stroke-width="6" stroke-linecap="round"/>
</svg>
