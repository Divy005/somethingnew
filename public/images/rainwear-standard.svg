<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A generic plastic local raincoat poncho with a torn seam">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="pvc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#59626f"/>
      <stop offset="50%" stop-color="#3c434e"/>
      <stop offset="100%" stop-color="#242a33"/>
    </linearGradient>
    <linearGradient id="pvcHi" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#gbg)"/>
  <ellipse cx="400" cy="540" rx="160" ry="16" fill="#000" opacity="0.55" filter="url(#gsoft)"/>

  <!-- floppy unadjustable hood -->
  <path d="M400 100 c-58 0 -96 34 -100 82 c-2 18 8 28 22 28 h156 c14 0 24 -10 22 -28 c-4 -48 -42 -82 -100 -82 Z" fill="url(#pvc)"/>
  <path d="M400 100 c-58 0 -96 34 -100 82 c-2 18 8 28 22 28 h18 c-16 -56 16 -90 60 -110 Z" fill="url(#pvcHi)"/>

  <!-- boxy poncho body, no shaping -->
  <path d="M286 210 h228 l86 62 c8 6 8 18 0 25 l-34 30 c-8 7 -20 6 -26 -2 l-22 -26 v199 c0 10 -8 18 -18 18 H306 c-10 0 -18 -8 -18 -18 V299 l-22 26 c-6 8 -18 9 -26 2 l-34 -30 c-8 -7 -8 -19 0 -25 Z"
        fill="url(#pvc)"/>
  <path d="M286 210 h54 l-20 312 h-14 c-10 0 -18 -8 -18 -18 V299 l-22 26 c-6 8 -18 9 -26 2 l-34 -30 c-8 -7 -8 -19 0 -25 Z" fill="url(#pvcHi)"/>

  <!-- cheap press-stud placket -->
  <rect x="394" y="210" width="12" height="312" rx="2" fill="#2a313c"/>
  <g fill="#6b7484">
    <circle cx="400" cy="258" r="5"/><circle cx="400" cy="318" r="5"/>
    <circle cx="400" cy="378" r="5"/><circle cx="400" cy="438" r="5"/>
  </g>

  <!-- torn seam -->
  <path d="M520 340 l16 22 l-14 16 l18 26" fill="none" stroke="#151a21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 340 l16 22 l-14 16 l18 26" fill="none" stroke="#8b95a5" stroke-width="1.6" stroke-dasharray="3 5"/>

  <!-- trapped condensation inside -->
  <g fill="#9aa4b4" fill-opacity="0.30">
    <circle cx="332" cy="300" r="5"/><circle cx="352" cy="342" r="4"/>
    <circle cx="324" cy="376" r="4.5"/><circle cx="356" cy="412" r="3.5"/>
    <circle cx="336" cy="450" r="4"/>
  </g>

  <!-- creases from being folded in a bag -->
  <g stroke="#1b2028" stroke-opacity="0.9" stroke-width="2.4" fill="none">
    <path d="M286 288 h228"/>
    <path d="M286 400 h228"/>
  </g>
</svg>
