<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Aerodynamic wind-stable umbrella with an asymmetric blunt-tip canopy">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1526"/>
      <stop offset="55%" stop-color="#0e2236"/>
      <stop offset="100%" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="canopyHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pbg)"/>
  <ellipse cx="415" cy="265" rx="330" ry="220" fill="url(#glow)"/>

  <!-- wind streaks -->
  <g stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M60 170 q70 -22 150 -6"/>
    <path d="M40 220 q90 -26 190 -8"/>
    <path d="M70 272 q60 -18 130 -6"/>
    <path d="M600 150 q80 -20 150 -4"/>
    <path d="M630 205 q70 -18 130 -4"/>
  </g>

  <!-- shadow -->
  <ellipse cx="400" cy="520" rx="180" ry="20" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <!-- shaft -->
  <rect x="392" y="150" width="12" height="360" rx="6" fill="url(#shaft)"/>
  <!-- ergonomic handle -->
  <path d="M392 480 v22 a34 34 0 0 1 -68 0 v-10" fill="none" stroke="url(#shaft)" stroke-width="13" stroke-linecap="round"/>

  <!-- asymmetric canopy: short front edge, long swept tail -->
  <path d="M398 140
           C 300 142, 196 196, 132 292
           q 46 34 92 6
           q 46 34 92 6
           q 46 32 92 4
           q 52 30 100 0
           q 54 28 104 -6
           C 700 214, 560 138, 398 140 Z"
        fill="url(#canopy)"/>
  <path d="M398 140 C 300 142, 196 196, 132 292 q 46 34 92 6 C 220 260, 300 176, 398 140 Z"
        fill="url(#canopyHi)"/>

  <!-- rib seams -->
  <g stroke="#0b2b40" stroke-opacity="0.45" stroke-width="2.5" fill="none">
    <path d="M398 142 C 330 190, 268 250, 224 298"/>
    <path d="M398 142 C 372 200, 344 254, 316 304"/>
    <path d="M398 142 C 420 200, 440 252, 458 302"/>
    <path d="M398 142 C 470 186, 540 238, 610 288"/>
  </g>

  <!-- blunt safety tips -->
  <g fill="#e2e8f0">
    <circle cx="132" cy="292" r="8"/>
    <circle cx="224" cy="298" r="7"/>
    <circle cx="316" cy="304" r="7"/>
    <circle cx="408" cy="308" r="7"/>
    <circle cx="508" cy="308" r="7"/>
    <circle cx="612" cy="286" r="8"/>
  </g>

  <!-- finial -->
  <path d="M398 140 l0 -32" stroke="url(#shaft)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="398" cy="104" r="7" fill="#e2e8f0"/>
</svg>
